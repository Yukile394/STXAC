plugins {
    id 'java'
}

group = 'me.navelya'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // 1.21.1 API ile derlenir; api-version "1.21" sayesinde tum 1.21.x surumlerinde (1.21, 1.21.1 ... 1.21.8) calisir.
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    filteringCharset = 'UTF-8'
}

tasks.named('jar') {
    archiveBaseName = 'NavelyaAC'
}
