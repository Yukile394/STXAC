general:
  ban-command: "ban {player} {reason}"
  ban-reason: "{prefix} &8» &b{check}"
  prefix: "&#9FD0F8N&#A2D0F8a&#A4D1F7v&#A7D1F7e&#AAD2F6l&#ACD2F6y&#AFD2F5a&#B1D3F5A&#B4D3F4C"
  alert-format: "{prefix} &8» &f{player} &7failed &b{check} &8(&7{info}&8) &8[&f{logs}&8/&f{max}&8]"
  ban-broadcast: "{prefix} &8» &f{player} &7banlandi &8» &b{check}"
  log-decay-seconds: 900
  target-range: 60.0
  combat-seconds: 120

